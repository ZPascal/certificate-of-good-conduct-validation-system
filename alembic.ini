[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is overridden at runtime by migrations/env.py using DB_* env vars.
# Set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD environment variables instead.
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/certificate_validation

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
